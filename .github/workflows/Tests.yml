name: "Tests"

on:
  pull_request:
    branches:
      - main
      - 'release-'
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch || github.ref != 'refs/tags/v*' }}

env:
  RETESTITEMS_NWORKERS: 4
  RETESTITEMS_NWORKERS_THREADS: 2

jobs:
  tests:
    name: "Tests"
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
        os:
          - "ubuntu-latest"
          - "macOS-latest"
          - "windows-latest"
        arch:
          - x64
    uses: "SciML/.github/.github/workflows/tests.yml@v1"
    with:
      os: ${{ matrix.os }}
      julia-version: ${{ matrix.version }}
      julia-arch: ${{ matrix.arch }}
    secrets: "inherit"
